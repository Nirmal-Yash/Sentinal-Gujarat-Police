server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2g;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    # Docker DNS: resolve service IPs dynamically after API/container recreation.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;
    set $api_upstream http://api:8000;
    set $media_upstream http://mediamtx:8888;

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 12s;
    }

    location /test-hls/ {
        proxy_pass         $media_upstream/;
        proxy_http_version 1.1;
        proxy_buffering     off;
        add_header          Cache-Control "no-store";
    }

    location /ws/ {
        proxy_pass         $api_upstream/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
