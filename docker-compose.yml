services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    build: ./database
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 15

  ingestion:
    build: ./ingestion
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      - CCTV_BASE_URL=${CCTV_BASE_URL:-https://cctv.corp8.cloud}
      - CCTV_LOGIN_PATH=${CCTV_LOGIN_PATH:-/auth/login}
      - CCTV_CATALOGUE_PATH=${CCTV_CATALOGUE_PATH:-/cameras.json}
      - CCTV_EMAIL=${CCTV_EMAIL:?CCTV_EMAIL must be supplied}
      - CCTV_PASSWORD=${CCTV_PASSWORD:?CCTV_PASSWORD must be supplied}
      - RTSP_HOST_IP=${RTSP_HOST_IP:-103.250.160.189}
      - RTSP_PORT=${RTSP_PORT:-8554}
      - SOURCE_MAX_FPS=${SOURCE_MAX_FPS:-15}
      - JPEG_QUALITY=${JPEG_QUALITY:-70}
      - FRAME_GATE_ENABLED=${FRAME_GATE_ENABLED:-true}
      - FRAME_GATE_MOTION_THRESHOLD=${FRAME_GATE_MOTION_THRESHOLD:-4.0}
      - FRAME_GATE_IDLE_SECS=${FRAME_GATE_IDLE_SECS:-10}
      - FRAME_GATE_THUMBNAIL_SIZE=${FRAME_GATE_THUMBNAIL_SIZE:-160}
      - CAMERA_ALIVE_KEY=${CAMERA_ALIVE_KEY:-camera_alive}
      - CAMERA_ALIVE_INTERVAL_SECS=${CAMERA_ALIVE_INTERVAL_SECS:-1}
      - RAW_FRAME_STREAM_MAXLEN=${RAW_FRAME_STREAM_MAXLEN:-500}
      - MAX_CONCURRENT_CAMERAS=${MAX_CONCURRENT_CAMERAS:-50}
      - CATALOGUE_SYNC_INTERVAL=${CATALOGUE_SYNC_INTERVAL:-300}
      - RECONNECT_MAX_DELAY=${RECONNECT_MAX_DELAY:-30}
      - SNAPSHOT_TTL_SECS=${SNAPSHOT_TTL_SECS:-30}
      - TEST_FRAME_FPS=${TEST_FRAME_FPS:-3}
      - TEST_RTSP_BASE=rtsp://mediamtx:8554
      - TEST_SESSION_POLL_SECS=${TEST_SESSION_POLL_SECS:-1}
      - TEST_FEED_POLL_SECS=${TEST_FEED_POLL_SECS:-0.5}
    volumes:
      - ./videos:/videos
      - ./test-data/videos:/test-data/videos:ro
      - test_videos:/test_videos

  ai_worker:
    build: ./ai_engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - YOLO_MODEL=${YOLO_MODEL:-yolov8n.pt}
      - DETECTION_CONF=${DETECTION_CONF:-0.4}
      - FRAME_SKIP=${FRAME_SKIP:-1}
      - YOLO_WORKERS=${YOLO_WORKERS:-4}
      - ANPR_ENABLED=${ANPR_ENABLED:-true}
      - ANPR_OCR_GPU=${ANPR_OCR_GPU:-false}
      - ANPR_OCR_INTERVAL_SECS=${ANPR_OCR_INTERVAL_SECS:-1.5}
      - ANPR_OCR_MIN_CONF=${ANPR_OCR_MIN_CONF:-0.35}
      - ANPR_VOTE_THRESHOLD=${ANPR_VOTE_THRESHOLD:-4}
      - ANPR_VOTE_WINDOW_SECS=${ANPR_VOTE_WINDOW_SECS:-8}
      - ANPR_TRACK_MIN_AGE_SECS=${ANPR_TRACK_MIN_AGE_SECS:-1.5}
      - ANPR_TRACK_EXPIRY_SECS=${ANPR_TRACK_EXPIRY_SECS:-3}
      - ANPR_OCR_WORKERS=${ANPR_OCR_WORKERS:-4}
      - ANPR_MAX_PENDING_JOBS=${ANPR_MAX_PENDING_JOBS:-20}
      - ANPR_MIN_VEHICLE_W=${ANPR_MIN_VEHICLE_W:-80}
      - ANPR_MIN_VEHICLE_H=${ANPR_MIN_VEHICLE_H:-60}
      - ANPR_MIN_PLATE_WIDTH=${ANPR_MIN_PLATE_WIDTH:-45}
      - ANPR_MIN_PLATE_HEIGHT=${ANPR_MIN_PLATE_HEIGHT:-15}
      - ANPR_MAX_CONCURRENT_TRACKS=${ANPR_MAX_CONCURRENT_TRACKS:-128}
      - CROWD_BASELINE_ALPHA=${CROWD_BASELINE_ALPHA:-0.04}
      - CROWD_DEVIATION_SIGMA=${CROWD_DEVIATION_SIGMA:-2.5}
      - CROWD_MIN_FLOW=${CROWD_MIN_FLOW:-3.5}
      - CROWD_BASELINE_WARMUP_SECS=${CROWD_BASELINE_WARMUP_SECS:-30}
      - CROWD_PERSISTENCE_SECS=${CROWD_PERSISTENCE_SECS:-5}
      - CROWD_COOLDOWN_SECS=${CROWD_COOLDOWN_SECS:-300}
      - RUNNING_FLOW_DELTA=${RUNNING_FLOW_DELTA:-6.0}
      - CROWD_MIN_PERSONS=${CROWD_MIN_PERSONS:-3}
      - CROWD_PERSON_DET_CONF=${CROWD_PERSON_DET_CONF:-0.45}
      - CROWD_PERSON_INFER_SIZE=${CROWD_PERSON_INFER_SIZE:-416}
      - FACE_ENABLED=${FACE_ENABLED:-true}
      - BEHAVIOR_ENABLED=${BEHAVIOR_ENABLED:-true}
      - AI_SUPERVISOR_INTERVAL_SECS=${AI_SUPERVISOR_INTERVAL_SECS:-10}
      - AI_RESTART_BASE_DELAY_SECS=${AI_RESTART_BASE_DELAY_SECS:-2}
      - AI_RESTART_MAX_DELAY_SECS=${AI_RESTART_MAX_DELAY_SECS:-60}
      - AI_HEALTH_PREFIX=${AI_HEALTH_PREFIX:-sentinel:ai:health:}
      - AI_HEALTH_TTL_SECS=${AI_HEALTH_TTL_SECS:-45}
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          memory: 6g

  person_investigation:
    build: ./ai_engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-u", "person_investigation_worker.py"]
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PERSON_INVESTIGATION_RESULT_TTL=${PERSON_INVESTIGATION_RESULT_TTL:-120}
      - PERSON_FACE_DET_SIZE=${PERSON_FACE_DET_SIZE:-800}
      - PERSON_FACE_DET_THRESHOLD=${PERSON_FACE_DET_THRESHOLD:-0.50}
      - PERSON_FACE_MIN_INPUT=${PERSON_FACE_MIN_INPUT:-160}
      - PERSON_FACE_MAX_INPUT=${PERSON_FACE_MAX_INPUT:-1280}
    shm_size: '1gb'
    deploy:
      resources:
        limits:
          memory: 2g

  test_person_investigation:
    build: ./ai_engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-u", "person_investigation_worker.py"]
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TEST_MODE=true
      - PERSON_INVESTIGATION_RESULT_TTL=${PERSON_INVESTIGATION_RESULT_TTL:-120}
      - PERSON_FACE_DET_SIZE=${PERSON_FACE_DET_SIZE:-800}
      - PERSON_FACE_DET_THRESHOLD=${PERSON_FACE_DET_THRESHOLD:-0.50}
      - PERSON_FACE_MIN_INPUT=${PERSON_FACE_MIN_INPUT:-160}
      - PERSON_FACE_MAX_INPUT=${PERSON_FACE_MAX_INPUT:-1280}
    shm_size: '1gb'

  test_ai_worker:
    build: ./ai_engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TEST_MODE=true
      - YOLO_MODEL=${YOLO_MODEL:-yolov8n.pt}
      - DETECTION_CONF=${DETECTION_CONF:-0.4}
      - FRAME_SKIP=${TEST_FRAME_SKIP:-1}
      - YOLO_WORKERS=${TEST_YOLO_WORKERS:-1}
      - ANPR_ENABLED=${ANPR_ENABLED:-true}
      - ANPR_OCR_GPU=${ANPR_OCR_GPU:-false}
      - ANPR_OCR_INTERVAL_SECS=${ANPR_TEST_OCR_INTERVAL_SECS:-1.5}
      - ANPR_OCR_MIN_CONF=${ANPR_OCR_MIN_CONF:-0.35}
      - ANPR_VOTE_THRESHOLD=${ANPR_TEST_VOTE_THRESHOLD:-3}
      - ANPR_VOTE_WINDOW_SECS=${ANPR_TEST_VOTE_WINDOW_SECS:-8}
      - ANPR_TRACK_MIN_AGE_SECS=${ANPR_TEST_TRACK_MIN_AGE_SECS:-1.5}
      - ANPR_TRACK_EXPIRY_SECS=${ANPR_TEST_TRACK_EXPIRY_SECS:-3}
      - ANPR_OCR_WORKERS=${ANPR_TEST_OCR_WORKERS:-2}
      - ANPR_MAX_PENDING_JOBS=${ANPR_TEST_MAX_PENDING_JOBS:-20}
      - TEST_PLATE_ALLOWLIST=${TEST_PLATE_ALLOWLIST:-GXIOSGJ}
      - ANPR_MIN_VEHICLE_W=${ANPR_MIN_VEHICLE_W:-80}
      - ANPR_MIN_VEHICLE_H=${ANPR_MIN_VEHICLE_H:-60}
      - ANPR_MIN_PLATE_WIDTH=${ANPR_MIN_PLATE_WIDTH:-45}
      - ANPR_MIN_PLATE_HEIGHT=${ANPR_MIN_PLATE_HEIGHT:-15}
      - ANPR_MAX_CONCURRENT_TRACKS=${ANPR_MAX_CONCURRENT_TRACKS:-128}
      - CROWD_BASELINE_ALPHA=${CROWD_BASELINE_ALPHA:-0.04}
      - CROWD_DEVIATION_SIGMA=${CROWD_DEVIATION_SIGMA:-3.0}
      - CROWD_MIN_FLOW=${CROWD_MIN_FLOW:-3.5}
      - CROWD_BASELINE_WARMUP_SECS=${CROWD_BASELINE_WARMUP_SECS:-10}
      - CROWD_PERSISTENCE_SECS=${CROWD_PERSISTENCE_SECS:-3}
      - CROWD_COOLDOWN_SECS=${CROWD_COOLDOWN_SECS:-30}
      - RUNNING_FLOW_DELTA=${RUNNING_FLOW_DELTA:-6.0}
      - FACE_ENABLED=${TEST_FACE_ENABLED:-true}
      - BEHAVIOR_ENABLED=${TEST_BEHAVIOR_ENABLED:-true}
    shm_size: '1gb'

  intelligence:
    build: ./intelligence
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      - FACE_SIM_THRESHOLD=${FACE_SIM_THRESHOLD:-0.65}
      - FACE_INVESTIGATION_THRESHOLD=${FACE_INVESTIGATION_THRESHOLD:-0.65}
      - PLATE_MATCH_THRESHOLD=${PLATE_MATCH_THRESHOLD:-0.9}
      - WATCHLIST_RELOAD_SECS=${WATCHLIST_RELOAD_SECS:-60}
      - WATCHLIST_UPDATE_CHANNEL=${WATCHLIST_UPDATE_CHANNEL:-watchlist:updated}
      - ALERT_DEDUP_PREFIX=${ALERT_DEDUP_PREFIX:-sentinel:alert:dedup:}
      - ALERT_EVENT_STREAM=${ALERT_EVENT_STREAM:-sentinel:prod:alert_events}
      - ALERT_COOLDOWN=${ALERT_COOLDOWN:-60}
      - CROSS_CAM_WINDOW=${CROSS_CAM_WINDOW:-300}
      - EVIDENCE_STORAGE_PATH=${EVIDENCE_STORAGE_PATH:-/evidence}
      - MAX_EVIDENCE_BYTES=${MAX_EVIDENCE_BYTES:-4194304}
    volumes:
      - evidence_data:/evidence

  test_intelligence:
    build: ./intelligence
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      - TEST_MODE=true
      - WATCHLIST_RELOAD_SECS=${WATCHLIST_RELOAD_SECS:-60}
      - WATCHLIST_UPDATE_CHANNEL=${WATCHLIST_UPDATE_CHANNEL:-watchlist:updated}
      - ALERT_DEDUP_PREFIX=${ALERT_DEDUP_PREFIX:-sentinel:test:alert:dedup:}
      - EVIDENCE_STORAGE_PATH=${EVIDENCE_STORAGE_PATH:-/evidence}
      - MAX_EVIDENCE_BYTES=${MAX_EVIDENCE_BYTES:-4194304}
      - ALERT_COOLDOWN=${ALERT_COOLDOWN:-60}
      - CROSS_CAM_WINDOW=${CROSS_CAM_WINDOW:-300}
    volumes:
      - test_evidence_data:/evidence

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be supplied}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-}
      - SNAPSHOT_TOKEN_SECRET=${SNAPSHOT_TOKEN_SECRET:?SNAPSHOT_TOKEN_SECRET must be supplied}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - SNAPSHOT_TOKEN_TTL_SECS=${SNAPSHOT_TOKEN_TTL_SECS:-120}
      - EVIDENCE_TOKEN_TTL_SECS=${EVIDENCE_TOKEN_TTL_SECS:-300}
      - EVIDENCE_STORAGE_PATH=${EVIDENCE_STORAGE_PATH:-/evidence}
      - CCTV_BASE_URL=${CCTV_BASE_URL:-https://cctv.corp8.cloud}
      - CCTV_LOGIN_PATH=${CCTV_LOGIN_PATH:-/auth/login}
      - CCTV_CATALOGUE_PATH=${CCTV_CATALOGUE_PATH:-/cameras.json}
      - CCTV_EMAIL=${CCTV_EMAIL:?CCTV_EMAIL must be supplied}
      - CCTV_PASSWORD=${CCTV_PASSWORD:?CCTV_PASSWORD must be supplied}
      - RTSP_HOST_IP=${RTSP_HOST_IP:-103.250.160.189}
      - RTSP_PORT=${RTSP_PORT:-8554}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_HOURS=${REFRESH_TOKEN_EXPIRE_HOURS:-8}
      - JWT_TOKEN_HOURS=${JWT_TOKEN_HOURS:-8}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - FORCE_SECURITY_HEADERS=${FORCE_SECURITY_HEADERS:-false}
      - DB_SSL=${DB_SSL:-0}
      - TEST_ENDPOINT_ENABLED=true
      - TEST_WATCHLIST_SEED_PLATES=${TEST_WATCHLIST_SEED_PLATES:-GJ01AB1234,GJ05CD5678,GJ07XX9999}
      - TEST_ASSET_CACHE_TTL=${TEST_ASSET_CACHE_TTL:-10}
      - TEST_MAX_UPLOAD_BYTES=${TEST_MAX_UPLOAD_BYTES:-209715200}
      - TEST_VIDEO_DIR=/test-data/videos
      - TEST_MAX_FEEDS=${TEST_MAX_FEEDS:-30}
      - TEST_UPLOAD_DIR=/test_videos
      - TEST_RTSP_BASE=rtsp://mediamtx:8554
      - TEST_HLS_BASE=/test-hls
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BOOTSTRAP_ADMIN_ROLE=${BOOTSTRAP_ADMIN_ROLE:-SUPERADMIN}
      - PERSON_INVESTIGATION_TIMEOUT=${PERSON_INVESTIGATION_TIMEOUT:-20}
      - FACE_INVESTIGATION_THRESHOLD=${FACE_INVESTIGATION_THRESHOLD:-0.65}
      - WATCHLIST_UPDATE_CHANNEL=${WATCHLIST_UPDATE_CHANNEL:-watchlist:updated}
      - MIGRATION_CONNECT_ATTEMPTS=${MIGRATION_CONNECT_ATTEMPTS:-12}
      - MIGRATION_CONNECT_RETRY_DELAY=${MIGRATION_CONNECT_RETRY_DELAY:-2}
      - AI_HEALTH_PREFIX=${AI_HEALTH_PREFIX:-sentinel:ai:health:}
      - AI_HEALTH_STALE_SECS=${AI_HEALTH_STALE_SECS:-45}
      - STARTUP_RETRIES=${STARTUP_RETRIES:-60}
      - STARTUP_RETRY_DELAY=${STARTUP_RETRY_DELAY:-1}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-40}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-15}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-15000}
      - DB_LOCK_TIMEOUT_MS=${DB_LOCK_TIMEOUT_MS:-5000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ./videos:/videos
      - test_videos:/test_videos
      - evidence_data:/evidence:ro

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    restart: unless-stopped
    volumes:
      - ./camera_sim/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  redis_data:
  postgres_data:
  test_videos:
  evidence_data:
  test_evidence_data:
