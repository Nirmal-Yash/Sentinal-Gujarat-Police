logLevel: warn
logDestinations: [stdout]

rtspAddress: :8554
hlsAddress: :8888
webrtcAddress: :8889

hlsAlwaysRemux: yes
hlsSegmentCount: 3
hlsSegmentDuration: 1s

# Test sessions publish only to /test/<session>/camN.  Production camera
# paths are never declared here, so MediaMTX cannot replace live sources.
pathDefaults:
  source: publisher
paths:
  "~^test/": {}
