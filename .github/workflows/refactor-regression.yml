name: Refactor regression

on:
  push:
    branches: ["test", "refactor/**"]
  pull_request:
    branches: ["test", "main"]

jobs:
  python-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sentinel_ci
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel -d sentinel_ci"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_ci
      REDIS_URL: redis://localhost:6379
      POSTGRES_PASSWORD: sentinel
      SECRET_KEY: ci-only-sentinel-signing-secret
      AUTH_REQUIRED: "true"
      ALERT_COOLDOWN: "60"
      CROSS_CAM_WINDOW: "300"
      SIGHTING_DEDUP_BUCKET_SECS: "30"
      EVIDENCE_ROOT: /tmp/sentinel-evidence
      REGISTRY_SMOKE_CAMERAS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostGIS into CI PostgreSQL service
        shell: bash
        run: |
          POSTGRES_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2=="pgvector/pgvector:pg16" {print $1; exit}')"
          test -n "$POSTGRES_CONTAINER"
          docker exec -u 0 "$POSTGRES_CONTAINER" bash -lc 'apt-get update && apt-get install -y --no-install-recommends postgresql-16-postgis-3 && rm -rf /var/lib/apt/lists/*'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary redis bcrypt PyJWT numpy
      - name: Bootstrap CI schema
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -f database/init.sql
      - name: Compile core Python modules
        shell: bash
        run: |
          python -m py_compile ingestion/worker.py
          python -m py_compile intelligence/evidence_capture.py
          python -m py_compile api/routes/evidence.py
          python -m py_compile api/routes/operations.py
          python -m py_compile ai_engine/*.py ai_engine/tests/*.py
          python -m py_compile intelligence/*.py api/*.py api/routes/*.py
      - name: Validate fresh migrations and idempotency
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'DROP DATABASE IF EXISTS sentinel_migration_ci WITH (FORCE);'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'CREATE DATABASE sentinel_migration_ci;'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_migration_ci -f database/init.sql
          DATABASE_URL=postgresql://sentinel:sentinel@localhost:5432/sentinel_migration_ci MIGRATIONS_DIR=${{ github.workspace }}/database/migrations python -c "from api.migrations import apply_migrations; apply_migrations(); apply_migrations()"
      - name: Run deterministic ANPR policy tests
        working-directory: ai_engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run intelligence evidence regression
        working-directory: intelligence
        run: python -m unittest test_evidence_capture.py -v
      - name: Run sighting-store import regression
        working-directory: intelligence
        run: python -m unittest test_sighting_store.py -v
      - name: Run P0 runtime persistence/alert E2E
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'DROP DATABASE IF EXISTS sentinel_p0_ci WITH (FORCE);'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'CREATE DATABASE sentinel_p0_ci;'
          DATABASE_URL=postgresql://sentinel:sentinel@localhost:5432/sentinel_p0_ci REDIS_URL=redis://localhost:6379 python scripts/p0_runtime_e2e.py
      - name: Run ANPR benchmark harness smoke test
        run: python scripts/anpr_benchmark.py scripts/fixtures/anpr_benchmark_smoke.csv --max-error-rate 0.50
      - name: Run 50-camera registry load smoke
        run: python scripts/registry_load_smoke.py
      - name: Run repository hygiene checks
        shell: bash
        run: |
          ! git ls-files -z | grep -F -z -E '(^|/)__pycache__/|\.pyc$'
          test -z "$(git ls-files .env)"
      - name: Validate refactor invariants
        run: python scripts/validate_refactor.py
      - name: Validate Compose configuration
        run: docker compose config -q

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
