name: P0 release gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: p0-release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: sentinel
  CCTV_PASSWORD: ci-placeholder
  SECRET_KEY: ci-only-sentinel-signing-secret
  JWT_REFRESH_SECRET_KEY: ci-only-refresh-signing-secret
  SNAPSHOT_TOKEN_SECRET: ci-only-snapshot-signing-secret
  FIELD_ENCRYPTION_KEY: Y2ktZmllbGQtZW5jcnlwdGlvbi1rZXktMzItYnl0ZSE=
  EVIDENCE_STORAGE_PATH: /tmp/sentinel-evidence
  ALLOWED_ORIGINS: http://localhost:3000

jobs:
  p0-backend-regression:
    name: P0 Backend Regression
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel_ci
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt
      - name: Start CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag sentinel-ci-postgres ./database
          docker run --detach --name sentinel-ci-postgres \
            --env POSTGRES_DB=sentinel_ci --env POSTGRES_USER=sentinel \
            --env POSTGRES_PASSWORD=sentinel --publish 5432:5432 sentinel-ci-postgres
          docker run --detach --name sentinel-ci-redis --publish 6379:6379 redis:7-alpine
          for attempt in {1..60}; do
            docker exec sentinel-ci-postgres pg_isready -U sentinel -d sentinel_ci >/dev/null 2>&1 && break
            if [ "$attempt" -eq 60 ]; then docker logs sentinel-ci-postgres; exit 1; fi
            sleep 2
          done
          for attempt in {1..30}; do
            docker exec sentinel-ci-redis redis-cli ping >/dev/null 2>&1 && break
            if [ "$attempt" -eq 30 ]; then docker logs sentinel-ci-redis; exit 1; fi
            sleep 1
          done
      - name: Build and start API container
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag sentinel-ci-api --file api/Dockerfile .
          docker run --detach --name sentinel-ci-api --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env REDIS_URL="$REDIS_URL" \
            --env AUTH_REQUIRED=true \
            --env SECRET_KEY="$SECRET_KEY" \
            --env JWT_REFRESH_SECRET_KEY="$JWT_REFRESH_SECRET_KEY" \
            --env SNAPSHOT_TOKEN_SECRET="$SNAPSHOT_TOKEN_SECRET" \
            --env FIELD_ENCRYPTION_KEY="$FIELD_ENCRYPTION_KEY" \
            --env CCTV_PASSWORD="$CCTV_PASSWORD" \
            --env BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            --env BOOTSTRAP_ADMIN_PASSWORD='CI-Backend-Password!2026' \
            --env BOOTSTRAP_ADMIN_ROLE=SUPERADMIN \
            --env EVIDENCE_STORAGE_PATH="$EVIDENCE_STORAGE_PATH" \
            sentinel-ci-api
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && break
            if [ "$attempt" -eq 60 ]; then docker logs sentinel-ci-api; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent http://127.0.0.1:8000/ready >/dev/null
      - name: Verify authentication and camera playback contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/cookies /tmp/login.json /tmp/me.json /tmp/refresh.json
          curl --fail --silent --show-error \
            -c /tmp/cookies -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:8000/auth/login \
            --data '{"username":"ci-admin","password":"CI-Backend-Password!2026"}' \
            -o /tmp/login.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/login.json'))
          assert payload['user']['username']=='ci-admin'
          assert payload.get('access_token')
          PY
          curl --fail --silent --show-error -b /tmp/cookies http://127.0.0.1:8000/auth/me -o /tmp/me.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/me.json'))
          assert payload['username']=='ci-admin' and payload['role']=='SUPERADMIN'
          PY
          curl --fail --silent --show-error -b /tmp/cookies -c /tmp/cookies \
            -X POST http://127.0.0.1:8000/auth/refresh \
            -H 'Content-Type: application/json' -o /tmp/refresh.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/refresh.json')).get('access_token')
          PY
          python - <<'PY'
          from pathlib import Path
          models=Path('api/models.py').read_text()
          cctv=Path('api/routes/cctv.py').read_text()
          snapshot=Path('api/routes/camera_snapshot.py').read_text()
          assert 'value["hls_url"]=f"/api/cctv/{provider_id}/index.m3u8"' in models
          assert 'request.cookies.get(COOKIE_NAME)' in cctv
          assert '_cookie_proxy_url' in cctv and 'return _proxy_url(resolved, token) if token else _cookie_proxy_url(resolved)' in cctv
          assert 'request.cookies.get(COOKIE_NAME)' in snapshot
          print('Authentication and camera playback contracts: PASS')
          PY
      - name: Compile Python services
        shell: bash
        run: |
          python -m py_compile ingestion/*.py
          python -m py_compile ai_engine/*.py ai_engine/tests/*.py
          python -m py_compile intelligence/*.py intelligence/test_*.py
          python -m py_compile api/*.py api/routes/*.py
          python -m py_compile scripts/p1_regression.py
      - name: Smoke import FastAPI application
        run: PYTHONPATH=api python -c "import main; assert main.app.title.startswith('Sentinel AI')"
      - name: Run ANPR regression
        working-directory: ai_engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run intelligence regressions
        working-directory: intelligence
        run: python -m unittest test_evidence_capture.py test_sighting_store.py -v
      - name: Run P1 intelligence consistency regression
        run: python scripts/p1_regression.py
      - name: Run P0 runtime E2E
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'DROP DATABASE IF EXISTS sentinel_p0_ci WITH (FORCE);'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'CREATE DATABASE sentinel_p0_ci;'
          PGPASSWORD=sentinel psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sentinel -d sentinel_p0_ci -f database/init.sql
          for migration in $(find database/migrations -maxdepth 1 -type f -name '*.sql' | sort -V); do
            PGPASSWORD=sentinel psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sentinel -d sentinel_p0_ci -f "$migration"
          done
          DATABASE_URL=postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel_p0_ci REDIS_URL=redis://127.0.0.1:6379 SECRET_KEY="$SECRET_KEY" SNAPSHOT_TOKEN_SECRET="$SNAPSHOT_TOKEN_SECRET" JWT_REFRESH_SECRET_KEY="$JWT_REFRESH_SECRET_KEY" FIELD_ENCRYPTION_KEY="$FIELD_ENCRYPTION_KEY" python scripts/p0_runtime_e2e.py
      - name: Run ANPR benchmark smoke
        run: python scripts/anpr_benchmark.py scripts/fixtures/anpr_benchmark_smoke.csv --max-error-rate 0.50
      - name: Run registry load smoke
        run: python scripts/registry_load_smoke.py
      - name: Validate refactor invariants
        run: python scripts/validate_refactor.py
      - name: Validate security contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'security module': Path('api/security_hardening.py').is_file(),
            'security audit middleware': 'SecurityAuditMiddleware' in Path('api/security_audit.py').read_text(),
            'security migration': Path('database/migrations/022_security_hardening.sql').is_file(),
            'separate refresh secret': 'JWT_REFRESH_SECRET_KEY' in Path('api/auth.py').read_text(),
            'short access token': 'ACCESS_TOKEN_MINUTES' in Path('api/auth.py').read_text(),
            'refresh rotation': 'revoked_tokens' in Path('api/routes/auth.py').read_text(),
            'session limit': 'MAX_SESSIONS_PER_USER' in Path('api/auth.py').read_text(),
            'lockout': 'LOCKOUT_USER_THRESHOLD' in Path('api/auth.py').read_text(),
            'SSRF guard': 'validate_external_url' in Path('api/security_hardening.py').read_text(),
            'request size limits': 'RequestSizeLimitMiddleware' in Path('api/security_hardening.py').read_text(),
            'security headers': 'Content-Security-Policy' in Path('api/security_hardening.py').read_text(),
            'field encryption': 'FieldEncryption' in Path('api/security_hardening.py').read_text(),
            'db pre-ping': 'pool_pre_ping=True' in Path('api/database.py').read_text(),
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Missing security contracts: '+', '.join(failed))
          print('Security contract gate: PASS')
          PY
      - name: Validate Compose
        run: docker compose config -q
      - name: Stop CI dependencies
        if: always()
        shell: bash
        run: docker rm --force sentinel-ci-api sentinel-ci-postgres sentinel-ci-redis >/dev/null 2>&1 || true

  p0-dashboard-build:
    name: P0 Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Run browser regression
        run: node scripts/p0_browser_regression.mjs
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  p0-release-contract:
    name: P0 Release Contract
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: sentinel
      CCTV_PASSWORD: ci-placeholder
      SECRET_KEY: ci-only-sentinel-signing-secret
      JWT_REFRESH_SECRET_KEY: ci-only-refresh-signing-secret
      SNAPSHOT_TOKEN_SECRET: ci-only-snapshot-signing-secret
      FIELD_ENCRYPTION_KEY: Y2ktZmllbGQtZW5jcnlwdGlvbi1rZXktMzItYnl0ZSE=
      EVIDENCE_STORAGE_PATH: /tmp/sentinel-evidence
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt
      - name: Validate current CCTV architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path('api'),Path('ai_engine'),Path('ingestion'),Path('intelligence'),Path('docker-compose.yml'),Path('.env.example')]
          deprecated='live'+'.corp8.cloud'; bad=[]
          for root in roots:
            paths=[root] if root.is_file() else root.rglob('*')
            for p in paths:
              if p.is_file() and p.suffix.lower() in {'.py','.yml','.yaml','.env','.example','.json'} and deprecated in p.read_text(encoding='utf-8',errors='ignore'):
                bad.append(p.as_posix())
          if bad: raise SystemExit('Deprecated CCTV host references found: '+', '.join(bad))
          compose=Path('docker-compose.yml').read_text(encoding='utf-8')
          if 'cctv.corp8.cloud' not in compose: raise SystemExit('Current CCTV host missing from Compose')
          print('Current CCTV architecture gate: PASS')
          PY
      - name: Validate P0 source contracts
        run: python scripts/final_integration_gate.py
      - name: Validate camera playback contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          models=Path('api/models.py').read_text()
          cctv=Path('api/routes/cctv.py').read_text()
          snapshot=Path('api/routes/camera_snapshot.py').read_text()
          dashboard=Path('dashboard/src/components/CameraGrid.jsx').read_text()
          checks={
            'stable same-origin HLS':'/api/cctv/{provider_id}/index.m3u8' in models,
            'cookie-authorized HLS':'request.cookies.get(COOKIE_NAME)' in cctv,
            'HLS child proxy rewrite':'_cookie_proxy_url' in cctv,
            'cookie-authorized snapshots':'request.cookies.get(COOKIE_NAME)' in snapshot,
            'dashboard HLS source':'hls_url' in dashboard,
            'production snapshot fallback':'/api/cameras/${cam.id}/snapshot' in dashboard,
            'test HLS isolation':'/test-hls/test/' in dashboard,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Missing camera playback contracts: '+', '.join(failed))
          print('Camera playback contract gate: PASS')
          PY
      - name: Validate asset security contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'snapshot secret':'SNAPSHOT_TOKEN_SECRET' in Path('docker-compose.yml').read_text(),
            'snapshot endpoint':'/snapshot-token' in Path('api/routes/camera_snapshot.py').read_text(),
            'signed evidence':'/content-signed' in Path('api/routes/evidence_assets.py').read_text() and '/signed-token' in Path('api/routes/evidence_assets.py').read_text(),
            'evidence path':'EVIDENCE_STORAGE_PATH' in Path('docker-compose.yml').read_text(),
            'runtime snapshot token':'snapshot-token' in Path('dashboard/src/runtimeGuards.js').read_text(),
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Missing asset contracts: '+', '.join(failed))
          print('Asset security contract gate: PASS')
          PY
      - name: Validate repository hygiene
        shell: bash
        run: |
          test -z "$(git ls-files .env)"
          ! git ls-files -z | grep -F -z -E '(^|/)__pycache__/|\.pyc$'
      - name: Validate exactly three P0 checks
        shell: bash
        run: |
          test "$(grep -c '^  p0-.*:$' .github/workflows/p0-release-gate.yml)" -eq 3
          grep -q '^    name: P0 Backend Regression$' .github/workflows/p0-release-gate.yml
          grep -q '^    name: P0 Dashboard Build$' .github/workflows/p0-release-gate.yml
          grep -q '^    name: P0 Release Contract$' .github/workflows/p0-release-gate.yml
          echo 'Exactly three P0 release checks declared: PASS'
      - name: Validate Compose configuration
        run: docker compose config -q
