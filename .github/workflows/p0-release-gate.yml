name: Sentinel Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: ci-postgres-password
  CCTV_EMAIL: ci@example.com
  CCTV_PASSWORD: ci-cctv-password
  SECRET_KEY: ci-signing-secret-key-32chars-min
  JWT_REFRESH_SECRET_KEY: ci-refresh-secret-key-32chars-min
  SNAPSHOT_TOKEN_SECRET: ci-snapshot-secret-key-32chars-min
  BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password

jobs:
  service-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -r api/requirements.txt
          pip install -r ai_engine/requirements.txt

      - name: Run in-repo service unit tests
        run: |
          pytest -q api/tests -o pythonpath=api
          pytest -q ai_engine/tests -o pythonpath=ai_engine

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package.json

      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Docker API startup smoke test
        run: |
          docker compose build api
          docker compose run --rm --no-deps api python -c "import main"

      - name: Docker ingestion import smoke test
        run: |
          docker compose build ingestion
          docker compose run --rm --no-deps ingestion python -c "import worker, catalogue_sync, stream_adapters, test_runner"
