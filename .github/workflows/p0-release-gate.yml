name: P0 release gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: sentinel
  CCTV_PASSWORD: ci-placeholder
  SECRET_KEY: ci-only-sentinel-signing-secret

jobs:
  p0-backend-regression:
    name: P0 Backend Regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sentinel_ci
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel -d sentinel_ci"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_ci
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-sentinel-signing-secret
      AUTH_REQUIRED: "true"
      ALERT_COOLDOWN: "60"
      CROSS_CAM_WINDOW: "300"
      SIGHTING_DEDUP_BUCKET_SECS: "30"
      EVIDENCE_ROOT: /tmp/sentinel-evidence
      REGISTRY_SMOKE_CAMERAS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary redis bcrypt PyJWT numpy
      - name: Verify CI PostgreSQL service
        shell: bash
        run: |
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=pgvector/pgvector:pg16 -q | sed -n '1p')"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" psql -U sentinel -d sentinel_ci -c 'SELECT version();'
      - name: Bootstrap CI schema
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -f database/init.sql
      - name: Apply versioned P1 migrations
        shell: bash
        run: |
          P1_MIGRATION="$(find database/migrations -maxdepth 1 -type f -name '*_p1_intelligence_consistency.sql' -print -quit)"
          test -n "$P1_MIGRATION"
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -f "$P1_MIGRATION"
      - name: Compile Python services
        shell: bash
        run: |
          python -m py_compile ingestion/*.py
          python -m py_compile ai_engine/*.py ai_engine/tests/*.py
          python -m py_compile intelligence/*.py intelligence/test_*.py
          python -m py_compile api/*.py api/routes/*.py
          python -m py_compile scripts/p1_regression.py
      - name: Run ANPR regression
        working-directory: ai_engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run intelligence regressions
        working-directory: intelligence
        run: python -m unittest test_evidence_capture.py test_sighting_store.py -v
      - name: Run P1 intelligence consistency regression
        run: python scripts/p1_regression.py
      - name: Run P0 runtime E2E
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'DROP DATABASE IF EXISTS sentinel_p0_ci WITH (FORCE);'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'CREATE DATABASE sentinel_p0_ci;'
          DATABASE_URL=postgresql://sentinel:sentinel@localhost:5432/sentinel_p0_ci REDIS_URL=redis://localhost:6379 python scripts/p0_runtime_e2e.py
      - name: Run ANPR benchmark smoke
        run: python scripts/anpr_benchmark.py scripts/fixtures/anpr_benchmark_smoke.csv --max-error-rate 0.50
      - name: Run registry load smoke
        run: python scripts/registry_load_smoke.py
      - name: Validate refactor invariants
        run: python scripts/validate_refactor.py
      - name: Validate Compose
        run: docker compose config -q

  p0-dashboard-build:
    name: P0 Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund
      - name: Run browser playback/fallback regression
        run: node scripts/p0_browser_regression.mjs
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  p0-release-contract:
    name: P0 Release Contract
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: sentinel
      CCTV_PASSWORD: ci-placeholder
      SECRET_KEY: ci-only-sentinel-signing-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary redis bcrypt PyJWT numpy
      - name: Validate current CCTV architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('api'), Path('ai_engine'), Path('ingestion'), Path('intelligence'), Path('docker-compose.yml'), Path('.env.example')]
          needle = "live" + ".corp8.cloud"
          bad = []
          for root in roots:
              paths = [root] if root.is_file() else root.rglob('*')
              for p in paths:
                  if not p.is_file() or p.suffix.lower() not in {'.py', '.yml', '.yaml', '.env', '.example', '.json'}: continue
                  try: text = p.read_text(encoding='utf-8', errors='ignore')
                  except Exception: continue
                  if needle in text: bad.append(p.as_posix())
          if bad: raise SystemExit('Deprecated CCTV host references found in production/config paths: ' + ', '.join(bad))
          compose = Path('docker-compose.yml').read_text(encoding='utf-8')
          if 'cctv.corp8.cloud' not in compose: raise SystemExit('Current CCTV host missing from Compose')
          print('Current CCTV architecture gate: PASS')
          PY
      - name: Validate P0 source contracts
        run: python scripts/final_integration_gate.py
      - name: Validate P1 source contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('ai_engine/plate_normalise.py'),
              Path('intelligence/plate_normalise.py'),
              Path('api/plate_normalise.py'),
              Path('ai_engine/behavior_policy.py'),
              Path('scripts/p1_regression.py'),
          ]
          missing = [p.as_posix() for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Missing required P1 source files: ' + ', '.join(missing))
          migrations = sorted(Path('database/migrations').glob('*_p1_intelligence_consistency.sql'))
          if len(migrations) != 1:
              raise SystemExit(f'Expected exactly one P1 intelligence migration, found {len(migrations)}: {[p.name for p in migrations]}')
          if 'vector(512)' not in migrations[0].read_text(encoding='utf-8'):
              raise SystemExit('P1 intelligence migration does not define test face embeddings')
          watchlist = Path('intelligence/watchlist_engine.py').read_text(encoding='utf-8')
          alert = Path('intelligence/alert_engine.py').read_text(encoding='utf-8')
          anpr = Path('ai_engine/anpr_worker.py').read_text(encoding='utf-8')
          behavior = Path('ai_engine/behavior_worker.py').read_text(encoding='utf-8')
          search = Path('api/routes/search.py').read_text(encoding='utf-8')
          checks = {
              'WATCHLIST_RELOAD_SECS': 'WATCHLIST_RELOAD_SECS' in watchlist,
              'watchlist:updated': 'watchlist:updated' in watchlist,
              'ALERT_DEDUP_PREFIX': 'ALERT_DEDUP_PREFIX' in alert,
              'ANPR_VOTE_THRESHOLD': 'ANPR_VOTE_THRESHOLD' in anpr,
              'AdaptiveBaseline': 'AdaptiveBaseline' in behavior,
              'CROWD_PERSISTENCE_SECS': 'CROWD_PERSISTENCE_SECS' in behavior,
              'X-Test-Session-Id': 'X-Test-Session-Id' in search,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Missing P1 source contracts: ' + ', '.join(failed))
          print('P1 source contract gate: PASS')
          PY
      - name: Validate repository hygiene
        shell: bash
        run: |
          test -z "$(git ls-files .env)"
          ! git ls-files -z | grep -F -z -E '(^|/)__pycache__/|\.pyc$'
      - name: Validate exactly three P0 checks
        shell: bash
        run: |
          test "$(grep -c '^  p0-.*:$' .github/workflows/p0-release-gate.yml)" -eq 3
          grep -q '^    name: P0 Backend Regression$' .github/workflows/p0-release-gate.yml
          grep -q '^    name: P0 Dashboard Build$' .github/workflows/p0-release-gate.yml
          grep -q '^    name: P0 Release Contract$' .github/workflows/p0-release-gate.yml
          echo 'Exactly three P0 release checks declared: PASS'
      - name: Validate Compose configuration
        run: docker compose config -q
