name: P0 release gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-backend-regression:
    name: P0 Backend Regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sentinel_ci
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel -d sentinel_ci"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_ci
      REDIS_URL: redis://localhost:6379
      POSTGRES_PASSWORD: sentinel
      SECRET_KEY: ci-only-sentinel-signing-secret
      AUTH_REQUIRED: "true"
      ALERT_COOLDOWN: "60"
      CROSS_CAM_WINDOW: "300"
      SIGHTING_DEDUP_BUCKET_SECS: "30"
      EVIDENCE_ROOT: /tmp/sentinel-evidence
      REGISTRY_SMOKE_CAMERAS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary redis bcrypt PyJWT numpy
      - name: Install PostGIS into CI PostgreSQL service
        shell: bash
        run: |
          POSTGRES_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2==\"pgvector/pgvector:pg16\" {print $1; exit}')"
          test -n "$POSTGRES_CONTAINER"
          docker exec -u 0 "$POSTGRES_CONTAINER" bash -lc 'apt-get update && apt-get install -y --no-install-recommends postgresql-16-postgis-3 && rm -rf /var/lib/apt/lists/*'
      - name: Bootstrap CI schema
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -f database/init.sql
      - name: Compile Python services
        shell: bash
        run: |
          python -m py_compile ingestion/*.py
          python -m py_compile ai_engine/*.py ai_engine/tests/*.py
          python -m py_compile intelligence/*.py
          python -m py_compile api/*.py api/routes/*.py
      - name: Run ANPR regression
        working-directory: ai_engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run intelligence regressions
        working-directory: intelligence
        run: python -m unittest test_evidence_capture.py test_sighting_store.py -v
      - name: Run P0 runtime E2E
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'DROP DATABASE IF EXISTS sentinel_p0_ci WITH (FORCE);'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'CREATE DATABASE sentinel_p0_ci;'
          DATABASE_URL=postgresql://sentinel:sentinel@localhost:5432/sentinel_p0_ci REDIS_URL=redis://localhost:6379 python scripts/p0_runtime_e2e.py
      - name: Run ANPR benchmark smoke
        run: python scripts/anpr_benchmark.py scripts/fixtures/anpr_benchmark_smoke.csv --max-error-rate 0.50
      - name: Run registry load smoke
        run: python scripts/registry_load_smoke.py
      - name: Validate refactor invariants
        run: python scripts/validate_refactor.py
      - name: Validate Compose
        run: docker compose config -q

  p0-dashboard-build:
    name: P0 Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Run browser playback/fallback regression
        run: node scripts/p0_browser_regression.mjs
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  p0-release-contract:
    name: P0 Release Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary redis bcrypt PyJWT numpy
      - name: Validate current CCTV architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = "live" + ".corp8.cloud"
          ignored = {Path('.git')}
          bad = []
          for p in Path('.').rglob('*'):
              if not p.is_file():
                  continue
              if any(part in {'.git','node_modules','dist','__pycache__'} for part in p.parts):
                  continue
              if p.as_posix().startswith('docs/'):
                  continue
              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              if needle in text:
                  bad.append(p.as_posix())
          if bad:
              raise SystemExit('Deprecated CCTV host references found: ' + ', '.join(bad))
          compose = Path('docker-compose.yml').read_text(encoding='utf-8')
          assert 'cctv.corp8.cloud' in compose, 'Current CCTV host missing from Compose'
          print('Current CCTV architecture gate: PASS')
          PY
      - name: Validate P0 source contracts
        run: python scripts/final_integration_gate.py
      - name: Validate repository hygiene
        shell: bash
        run: |
          test -z "$(git ls-files .env)"
          ! git ls-files -z | grep -F -z -E '(^|/)__pycache__/|\.pyc$'
      - name: Validate three P0 checks are declared
        shell: bash
        run: |
          grep -q 'p0-backend-regression:' .github/workflows/p0-release-gate.yml
          grep -q 'p0-dashboard-build:' .github/workflows/p0-release-gate.yml
          grep -q 'p0-release-contract:' .github/workflows/p0-release-gate.yml
          echo 'Three P0 release checks declared: PASS'
      - name: Validate Compose configuration
        run: docker compose config -q
