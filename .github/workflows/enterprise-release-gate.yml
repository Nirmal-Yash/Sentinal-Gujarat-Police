name: Enterprise release gate

on:
  push:
    branches: ["refactor/enterprise-hardening"]
  pull_request:
    branches: ["test", "main"]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sentinel_ci
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel -d sentinel_ci"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_ci
      REDIS_URL: redis://localhost:6379
      POSTGRES_PASSWORD: sentinel
      SECRET_KEY: ci-only-sentinel-signing-secret
      AUTH_REQUIRED: "true"
      EVIDENCE_ROOT: /tmp/sentinel-evidence
      REGISTRY_SMOKE_CAMERAS: "50"
      ALERT_COOLDOWN: "60"
      CROSS_CAM_WINDOW: "300"
      SIGHTING_DEDUP_BUCKET_SECS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary redis bcrypt PyJWT numpy
      - name: Install PostGIS into CI PostgreSQL service
        shell: bash
        run: |
          POSTGRES_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2=="pgvector/pgvector:pg16" {print $1; exit}')"
          test -n "$POSTGRES_CONTAINER"
          docker exec -u 0 "$POSTGRES_CONTAINER" bash -lc 'apt-get update && apt-get install -y --no-install-recommends postgresql-16-postgis-3 && rm -rf /var/lib/apt/lists/*'
      - name: Compile all refactor modules
        shell: bash
        run: |
          python -m py_compile ingestion/worker.py
          python -m py_compile intelligence/evidence_capture.py
          python -m py_compile api/routes/evidence.py
          python -m py_compile api/routes/operations.py
          python -m py_compile ai_engine/*.py ai_engine/tests/*.py
          python -m py_compile ingestion/*.py intelligence/*.py api/*.py api/routes/*.py
      - name: Validate migration numbering and SQL structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path('database/migrations').glob('*.sql'))
          versions = []
          for f in files:
              m = re.match(r'^(\d+)_', f.name)
              assert m, f'Invalid migration filename: {f.name}'
              versions.append(m.group(1))
          assert len(versions) == len(set(versions)), f'Duplicate migration versions: {versions}'
          assert '012_sighting_deduplication.sql' not in [f.name for f in files]
          print(f'Validated {len(files)} migrations')
          PY
      - name: Run frontend route and metadata regressions
        run: |
          node scripts/route_state_regression.mjs
          python scripts/p1_metadata_regression.py
      - name: Run fresh database bootstrap and migration idempotency verification
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'DROP DATABASE IF EXISTS sentinel_release_ci WITH (FORCE);'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'CREATE DATABASE sentinel_release_ci;'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_release_ci -c 'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_release_ci -f database/init.sql
          DATABASE_URL=postgresql://sentinel:sentinel@localhost:5432/sentinel_release_ci MIGRATIONS_DIR=${{ github.workspace }}/database/migrations python -c "from api.migrations import apply_migrations; apply_migrations(); apply_migrations()"
      - name: Run final business-flow gate
        run: python scripts/final_integration_gate.py
      - name: Run final repository gate
        run: bash scripts/ci_final_verify.sh
      - name: Run ANPR regressions
        working-directory: ai_engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run intelligence regressions
        working-directory: intelligence
        run: python -m unittest test_evidence_capture.py test_sighting_store.py -v
      - name: Run P0 data-plane E2E
        shell: bash
        run: |
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'DROP DATABASE IF EXISTS sentinel_p0_release_ci WITH (FORCE);'
          PGPASSWORD=sentinel psql -h 127.0.0.1 -U sentinel -d sentinel_ci -c 'CREATE DATABASE sentinel_p0_release_ci;'
          DATABASE_URL=postgresql://sentinel:sentinel@localhost:5432/sentinel_p0_release_ci REDIS_URL=redis://localhost:6379 python scripts/p0_runtime_e2e.py
      - name: Run 50-camera registry smoke
        run: python scripts/registry_load_smoke.py
      - name: Run ANPR benchmark smoke
        run: python scripts/anpr_benchmark.py scripts/fixtures/anpr_benchmark_smoke.csv --max-error-rate 0.50
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Run invariant and hygiene gate
        run: python scripts/validate_refactor.py
      - name: Validate Compose
        run: docker compose config -q
